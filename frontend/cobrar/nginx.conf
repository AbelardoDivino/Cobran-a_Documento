server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Upload de extrato/comprovante (multipart) e imports CSV/OFX em JSON
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.mercadopago.com https://www.mercadopago.com https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://sdk.mercadopago.com https://www.mercadopago.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://*.mercadopago.com; img-src 'self' data: https:; connect-src 'self' https://api.mercadopago.com https://*.mercadopago.com https://accounts.google.com https://apis.google.com; frame-src 'self' https://*.mercadopago.com https://www.mercadopago.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://*.mercadopago.com; frame-ancestors 'self'" always;

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API e arquivos privados ficam no mesmo domínio do frontend (sem CORS).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
